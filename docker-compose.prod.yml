version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: welfare-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-welfare_db}
    volumes:
      - welfare-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # We do not expose 5432 to host to avoid conflicts with existing VPS databases

  redis:
    image: redis:7-alpine
    container_name: welfare-redis
    restart: unless-stopped
    # We do not expose 6379 to host

  meilisearch:
    image: getmeili/meilisearch:v1.9.0
    container_name: welfare-meilisearch
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_API_KEY:-meilisearch_master_key}
      - MEILI_ENV=production
    volumes:
      - welfare-meili-data:/meili_data
    ports:
      - "127.0.0.1:7700:7700" # local only: Nginx routes /search to it, the internet never reaches it directly
    restart: unless-stopped

  medusa-api:
    build: 
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: welfare-api
    volumes:
      - welfare-static:/app/apps/api/static
    depends_on:
      - postgres
      - redis
      - meilisearch
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-welfare_db}?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - MEDUSA_BACKEND_URL=${MEDUSA_BACKEND_URL} # public URL of uploaded files (<backend>/static)
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY:-meilisearch_master_key}
      - STORE_CORS=${STORE_URL}
      - ADMIN_CORS=${ADMIN_URL}
      - AUTH_CORS=${STORE_URL},${ADMIN_URL}
      - JWT_SECRET=${JWT_SECRET:-super_secret}
      - COOKIE_SECRET=${COOKIE_SECRET:-super_secret}
      - PAWAPAY_API_KEY=${PAWAPAY_API_KEY}
      - PAWAPAY_PAYOUT_RECIPIENTS=${PAWAPAY_PAYOUT_RECIPIENTS} # numbers allowed to receive withdrawals (admin Paiements)
      - TARA_API_KEY=${TARA_API_KEY} # Tara Money (Orange Money collections), production key: Tara has no sandbox
      - TARA_BUSINESS_ID=${TARA_BUSINESS_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_OTP_TEMPLATE_NAME=${WHATSAPP_OTP_TEMPLATE_NAME:-otp_code}
      - WHATSAPP_API_VERSION=${WHATSAPP_API_VERSION:-v21.0}
      # TODO: switch back to :-false once the WhatsApp Business API (WABA) is
      # set up — until then, codes are logged by the api container instead of
      # sent, so only someone with server log access can complete OTP signup/login.
      - WHATSAPP_DEBUG_LOG=${WHATSAPP_DEBUG_LOG:-true}
    ports:
      - "9005:9000" # Exposes 9005 to host for Nginx to route to
    restart: unless-stopped

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://api.thewelfarecm.com
        NEXT_PUBLIC_MEILISEARCH_HOST: https://api.thewelfarecm.com/search
        # Baked into the browser bundle: a key restricted to `search` on the products index, NEVER the master key
        # (which would let anyone rewrite or delete the indexes). See scripts/meili-search-key.sh.
        NEXT_PUBLIC_MEILISEARCH_API_KEY: ${MEILISEARCH_SEARCH_KEY:?set MEILISEARCH_SEARCH_KEY to a search-only Meilisearch key}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY:-pk_a444d1be79f71d0d6530d64a99c9639cf892b40452874ecefa30ff900404e489}
    container_name: welfare-storefront
    depends_on:
      - medusa-api
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_MEDUSA_BACKEND_URL=${MEDUSA_BACKEND_URL}
      - NEXT_PUBLIC_BASE_URL=${STORE_URL}
      - NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${MEDUSA_PUBLISHABLE_KEY:-pk_a444d1be79f71d0d6530d64a99c9639cf892b40452874ecefa30ff900404e489}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_SEARCH_KEY=${MEILISEARCH_SEARCH_KEY:?set MEILISEARCH_SEARCH_KEY to a search-only Meilisearch key}
      - ADMIN_BLOG_KEY=${ADMIN_BLOG_KEY}
    volumes:
      - welfare-blog-data:/app/apps/storefront/data
    ports:
      - "3005:3000" # Exposes 3005 to host for Nginx to route to
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://api.thewelfarecm.com
    container_name: welfare-admin
    depends_on:
      - medusa-api
    environment:
      - NODE_ENV=production
      - MEDUSA_BACKEND_URL=https://api.thewelfarecm.com
      - NEXT_PUBLIC_MEDUSA_BACKEND_URL=https://api.thewelfarecm.com
      - POSTHOG_PERSONAL_API_KEY=${POSTHOG_PERSONAL_API_KEY}
      - POSTHOG_PROJECT_ID=${POSTHOG_PROJECT_ID:-616113}
      - STOREFRONT_URL=http://storefront:3000
      - ADMIN_BLOG_KEY=${ADMIN_BLOG_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY} # AI product sheet (admin product form)
    ports:
      - "3006:3000" # Exposes 3006 to host for Nginx to route to (admin.thewelfare.store)
    restart: unless-stopped


volumes:
  welfare-pgdata:
  welfare-meili-data:
  welfare-static:
  welfare-blog-data:
